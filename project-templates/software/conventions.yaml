# 项目规范规则集
# enforcement: LINT | CI | REVIEW | PROSE
# check: 对应的 lint 规则或 CI 检查标识（可选）
# 默认 REVIEW；项目负责人确认真实自动化入口后，才改为 LINT/CI 并填写 check。

version: 1
project: <project-key>

rules:
  - id: comment-why-not-what
    statement: 注释只解释「为什么」，不复述代码
    scope: [frontend, backend]
    enforcement: REVIEW
    example:
      good: '// 兼容 2.x 客户端，3.0 全量后删除（zhang，2026-03）'
      bad: '// 设置 name'

  - id: todo-owner-deadline
    statement: TODO 必须带负责人和期限
    scope: [frontend, backend, qa]
    enforcement: REVIEW
    example:
      good: '// TODO(zhang): 2026-12-01 去掉兼容分支'
      bad: '// TODO: 以后再说'

  - id: comment-language
    statement: 注释用中文，标识符与提交信息用英文
    scope: [frontend, backend]
    enforcement: REVIEW

  - id: public-jsdoc
    statement: 公共函数必须有 JSDoc（用途、参数、返回、异常）
    scope: [backend]
    enforcement: REVIEW

  - id: no-secret-in-code
    statement: 禁止提交密钥、证书与 .env
    scope: [frontend, backend, qa, ops]
    enforcement: REVIEW

  - id: error-mask
    statement: 对外错误必须脱敏，不暴露堆栈与内部路径
    scope: [backend]
    enforcement: REVIEW

  - id: request-id-log
    statement: 请求日志必须带 requestId
    scope: [backend]
    enforcement: REVIEW

  - id: commit-format
    statement: '提交信息形如 <type>(<scope>): <描述> (<需求编号>)'
    scope: [frontend, backend]
    enforcement: REVIEW

  - id: migration-rollback
    statement: 数据迁移必须带可执行的回滚脚本
    scope: [backend]
    enforcement: REVIEW

  - id: exception-recorded
    statement: 偏离规范必须在 PR 描述里记录原因与回归条件
    scope: [frontend, backend, qa, ops]
    enforcement: REVIEW
