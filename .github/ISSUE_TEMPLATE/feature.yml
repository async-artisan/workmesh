name: Feature request
description: Propose a user-facing improvement or new capability
title: 'feat: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and the behavior you want to improve. Large protocol or architecture changes should include compatibility and migration considerations.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is affected, and what is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired user-visible behavior and a concrete example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches and why they are insufficient.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API or protocol
        - Web UI
        - CLI
        - workmesh-box
        - Role packages
        - Documentation
        - Build or CI
        - Other
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration impact
      description: Note API, database, configuration, security, deployment, or backward-compatibility effects. Write “none known” when applicable.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Add user feedback, links, prototype notes, acceptance criteria, or a proposed test.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I understand that this is a proposal for discussion, not a commitment to implement.
          required: true
