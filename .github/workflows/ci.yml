name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workmesh_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WORKMESH_V1_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workmesh_shadow?schema=workmesh_v1
      WORKMESH_TEST_ENV: ci
      WORKMESH_TEST_DATABASE_USERS: postgres
      WORKMESH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workmesh_test_ci?schema=workmesh_v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Keep CI's Node baseline consistent with the contribution guide.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated database tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE workmesh_test_ci'
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      # One entry for contributors and CI: verify the explicit target identity,
      # migrate this empty isolated database, check drift, and run every local gate.
      - name: Verify complete local quality gates
        run: pnpm verify -- --apply-migrations
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence
          path: |
            .tmp/browser-results/**/business-chain-result.json
            .tmp/browser-results/**/baseline-change-result.json
            .tmp/ui-review-results
            .tmp/ui-review-captures
          if-no-files-found: ignore
