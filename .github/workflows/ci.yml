name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Shared setup: used by all jobs via reusable steps through composite action.
# Each job checks out + installs deps independently (GitHub Actions caches
# pnpm store, so this is fast after the first job warms the cache).
# ---------------------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------------------
  # lint — format, type-check, eslint (no database, fastest feedback)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared (required for type-check)
        run: pnpm --filter @workmesh/shared build
      - run: pnpm format:check
      - run: pnpm type-check
      - run: pnpm lint:eslint

  # ---------------------------------------------------------------------------
  # unit — workspace tests + script guards + contract tests (no database)
  # ---------------------------------------------------------------------------
  unit:
    name: Unit & contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared
        run: pnpm --filter @workmesh/shared build
      - name: Generate Prisma client (unit tests only, no DB needed)
        run: pnpm --filter @workmesh/api exec prisma generate --schema prisma/schema.prisma
        env:
          PRISMA_GENERATE_SKIP_AUTOINSTALL: 'true'
          PRISMA_HIDE_UPDATE_MESSAGE: 'true'
      - name: Workspace unit tests
        run: pnpm exec turbo run test --force --env-mode=loose --concurrency=2
        env:
          CI: '1'
          WORKMESH_POC_LIVE: '0'
          WORKMESH_GITHUB_LIVE: '0'
          WORKMESH_V1_DATABASE_URL: postgresql://placeholder@127.0.0.1:1/placeholder?schema=workmesh_v1
      - name: Script guards
        run: >-
          node --test
          scripts/verify-release.test.mjs
          scripts/release-readiness.test.mjs
          scripts/verify-bundle-evidence.test.mjs
          scripts/validate-cyclonedx.test.mjs
          scripts/merge-bundle-sbom.test.mjs
          scripts/verify-cli-package.test.mjs
          scripts/package-licenses.test.mjs
          scripts/lib/isolated-prisma-paths.test.mjs
          scripts/test-integration.test.mjs
          scripts/first-run-demo-key.test.mjs
          scripts/box/dependency-links.test.mjs
          scripts/box/web-server.test.mjs
          scripts/api-agent-poc/runtime.test.mjs
          scripts/api-agent-poc/workmesh-http.test.mjs
          scripts/benchmark-revision-summary.test.mjs
          scripts/benchmark-api.test.mjs
          patches/deepmerge.test.mjs
          scripts/verify.test.mjs
        env:
          CI: '1'
      - name: Contract tests
        run: node scripts/test-contracts.mjs
        env:
          CI: '1'

  # ---------------------------------------------------------------------------
  # integration — real PostgreSQL: migrations + API integration + schema drift
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workmesh_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WORKMESH_V1_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workmesh_shadow?schema=workmesh_v1
      WORKMESH_TEST_ENV: ci
      WORKMESH_TEST_DATABASE_USERS: postgres
      WORKMESH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workmesh_test_ci?schema=workmesh_v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared
        run: pnpm --filter @workmesh/shared build
      - name: Create isolated test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE workmesh_test_ci'
      - name: Generate Prisma client
        run: pnpm --filter @workmesh/api exec prisma generate --schema prisma/schema.prisma
        env:
          PRISMA_GENERATE_SKIP_AUTOINSTALL: 'true'
          PRISMA_HIDE_UPDATE_MESSAGE: 'true'
      - name: API integration tests (apply migrations)
        run: pnpm test:integration -- --apply-migrations
      - name: Schema drift check
        run: >-
          pnpm --filter @workmesh/api exec prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

  # ---------------------------------------------------------------------------
  # build — production build + bundle evidence (no database)
  # ---------------------------------------------------------------------------
  build:
    name: Build & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared and role-packages first
        run: |
          pnpm --filter @workmesh/shared build
          pnpm --filter @workmesh/role-packages build
      - name: Generate Prisma client
        run: pnpm --filter @workmesh/api exec prisma generate --schema prisma/schema.prisma
        env:
          PRISMA_GENERATE_SKIP_AUTOINSTALL: 'true'
          PRISMA_HIDE_UPDATE_MESSAGE: 'true'
      - name: Full workspace production build
        run: pnpm exec turbo run build --force --env-mode=loose --concurrency=1
        env:
          NODE_ENV: production
      - name: Bundle evidence (shared)
        run: node scripts/verify-bundle-evidence.mjs packages/shared/dist
      - name: Bundle evidence (cli)
        run: node scripts/verify-bundle-evidence.mjs apps/cli/dist
      - name: Bundle evidence (web)
        run: node scripts/verify-bundle-evidence.mjs apps/web/dist

  # ---------------------------------------------------------------------------
  # browser — Chromium E2E + UI review + API coverage (needs real PostgreSQL)
  # ---------------------------------------------------------------------------
  browser:
    name: Browser & coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workmesh_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WORKMESH_V1_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workmesh_shadow?schema=workmesh_v1
      WORKMESH_TEST_ENV: ci
      WORKMESH_TEST_DATABASE_USERS: postgres
      WORKMESH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workmesh_browser_ci?schema=workmesh_v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared and role-packages
        run: |
          pnpm --filter @workmesh/shared build
          pnpm --filter @workmesh/role-packages build
      - name: Create isolated browser test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE workmesh_browser_ci'
      - name: Generate Prisma client
        run: pnpm --filter @workmesh/api exec prisma generate --schema prisma/schema.prisma
        env:
          PRISMA_GENERATE_SKIP_AUTOINSTALL: 'true'
          PRISMA_HIDE_UPDATE_MESSAGE: 'true'
      - name: Build API and Web for browser tests
        run: |
          pnpm --filter @workmesh/api build
          pnpm --filter @workmesh/web build
        env:
          NODE_ENV: production
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium --only-shell
      - name: Apply migrations for browser tests
        run: pnpm --filter @workmesh/api exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Browser tests (Chromium E2E)
        run: pnpm test:browser:run
      - name: UI review (mock API)
        run: pnpm test:ui-review
      - name: API coverage
        run: pnpm --filter @workmesh/api test:coverage
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence
          path: |
            .tmp/browser-results/**/business-chain-result.json
            .tmp/browser-results/**/baseline-change-result.json
            .tmp/ui-review-results
            .tmp/ui-review-captures
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # gate — required status check; all parallel jobs must pass
  # Set this job as the branch protection required status check instead of the
  # individual jobs so the required check name stays stable when jobs are added.
  # ---------------------------------------------------------------------------
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [lint, unit, integration, build, browser]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.unit.result }}" != "success" ||
                "${{ needs.integration.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ||
                "${{ needs.browser.result }}" != "success" ]]; then
            echo "One or more CI jobs failed:"
            echo "  lint:        ${{ needs.lint.result }}"
            echo "  unit:        ${{ needs.unit.result }}"
            echo "  integration: ${{ needs.integration.result }}"
            echo "  build:       ${{ needs.build.result }}"
            echo "  browser:     ${{ needs.browser.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
