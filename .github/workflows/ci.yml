name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # 20.17+ 才有 require(ESM)；api 的 vitest 集成配置经 unplugin-swc 加载，
          # 低版本会在启动阶段直接失败。
          node-version: 20.19
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm type-check
      - run: pnpm lint:eslint
      - run: pnpm --filter @workmesh/api exec prisma validate --schema prisma/schema.prisma
      - run: pnpm test
      # 契约脚本与进程内 HTTP 套件此前不在流水线里：
      # `pnpm test` 只匹配 src/**/*.spec.ts，test/** 从不执行。
      - run: pnpm --filter @workmesh/shared build
      - run: node scripts/test-contracts.mjs
      - run: pnpm --filter @workmesh/api test:integration
      - run: pnpm build
