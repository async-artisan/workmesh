# 验收条目模板
# key 稳定、永不复用；删除条目用墓碑标记，不复用 key。
# verification: TEST | INSPECTION | DEMO
# 正式 API 字段只有 key / text / verification；风险分类写在 PRD/评审材料。
# candidate --acceptance 读取 JSON 数组；使用配套 acceptance.json 或先转换 acceptance 数组。

version: 1
requirement: <PROJECT_KEY>-<序号>

acceptance:
  - key: ac-01
    text: <一个可观测结果，一句话，可判定>
    verification: TEST

  - key: ac-02
    text: <界面/文案/配置类结果>
    verification: INSPECTION

  - key: ac-03
    text: <需要按步骤演示才能判断的结果>
    verification: DEMO

removed: []
# removed 示例：- key: ac-00\n#   reason: <为什么删除>\n#   replacedBy: ac-01
