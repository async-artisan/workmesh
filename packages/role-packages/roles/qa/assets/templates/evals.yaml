# 评测结果模板
# 固定环境与版本，结果才可比较；失败必须分类，不重跑到绿。

suite: <suite 名称>
phase: EXECUTION
requirement: <PROJECT_KEY>-<序号>
casesRevision:
  artifactId: <已存在的不可变 CASES 工件 ID>
  sha256: <该工件真实的 64 位小写 SHA-256>
projectRepositoryId: <WorkMesh 登记仓库 ID，不是提供方数字 ID>
commit: <40 位 sha>
environment:
  build: <版本或镜像>
  database: <版本>
  services: []
  startedAt: <ISO 时间>

summary:
  total: 0
  passed: 0
  failed: 0
  flaky: 0
  durationMs: 0

results:
  - case: TC-<序号>-01
    # 每条执行在 quality 1.1 的 evidence.caseRefs 中复制精确 caseId 与 casesRevision。
    status: PASSED
    durationMs: 0
  - case: TC-<序号>-04
    status: FAILED
    durationMs: 0
    kind: PRODUCT_DEFECT
    evidence: <日志 / 截图 / 请求 ID>

failures:
  - case: TC-<序号>-04
    kind: PRODUCT_DEFECT
    reason: <一句话根因>
  - case: TC-<序号>-07
    kind: CASE_INVALID
    reason: <断言仍按旧版契约编写>
  - case: TC-<序号>-09
    kind: ENVIRONMENT
    reason: <依赖未启动>
